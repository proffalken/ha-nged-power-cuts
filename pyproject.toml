[project]
name = "ha-nged-power-cuts"
version = "0.3.0"
description = "Home Assistant custom integration for National Grid Electricity Distribution power cuts"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.373",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
